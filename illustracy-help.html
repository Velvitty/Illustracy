<style>

    --sel: #2e3650; --sel-ink: #ffffff; --ok: #4cc38a; --warn: #e0a84b; --danger: #e06363;
    --hover: rgba(231, 232, 236, .06); --soft: rgba(231, 232, 236, .04); --mark: rgba(108, 140, 255, .22);

}

.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }

.stage ol { list-style: none; margin: 0; padding: 0; counter-reset: st; }

.stage li b { display: block; font-size: 14px; }

.stack .sheet.chk { background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0; }

.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; font-size: 13px; line-height: 1.45; }

.lrow { display: grid; grid-template-columns: 18px 30px 1fr; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: none; }

.lrow.sel { background: var(--sel); color: var(--sel-ink); }

.shot { display: grid; grid-template-columns: 0.9fr 1.6fr 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 14px 0; background: var(--panel); font-size: 12px; min-width: 0; }
.shot > div { padding: 10px; min-width: 0; }

.shot .bar span.on { background: var(--sel); color: var(--sel-ink); }

.shot .f { height: 7px; border-radius: 4px; background: var(--panel-2); margin: 7px 0; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 6px 0 2px; }

.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; border: 1px solid var(--line-2); margin-right: 4px; }
.steps { counter-reset: sp; list-style: none; padding-left: 0 !important; }
.steps > li { position: relative; padding-left: 36px; margin: 10px 0; }
.steps > li::before { counter-increment: sp; content: counter(sp); position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 6px; background: var(--sel); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--accent); font-size: 12.5px; font-weight: 800; line-height: 24px; text-align: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
.kpi { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 10px 12px; }
.kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--accent); }

.bars .b .tr { height: 12px; background: var(--panel-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }

.bars .b.hl .tr i { background: var(--accent); }
.bars .b span:last-child { text-align: right; color: var(--muted); }
.foot { max-width: 1180px; margin: 0 auto; padding: 18px 24px 30px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 16px 56px; }
  .side { position: static; max-height: none; overflow: visible; margin-top: 14px; padding: 10px 12px; }
  .tocbox > summary { display: flex; align-items: center; justify-content: space-between; }
  .tocbox > summary::after { content: "▾"; color: var(--muted); }
  .tocbox[open] > summary::after { content: "▴"; }
  .tocbox[open] > summary { margin-bottom: 10px; }
  .side h2.lbl { display: none; }
  .top .in { padding: 8px 16px; }
  dl.terms { grid-template-columns: 1fr; gap: 2px; }
  dl.terms dd { margin-bottom: 10px; }
  .hero { grid-template-columns: 1fr; }
  .shot { grid-template-columns: 1fr; }
  .shot .l, .shot .r { border: 0; border-bottom: 1px solid var(--line); }
}
@media print {
  .top, .side, .foot, .skip { display: none; }
  .layout { display: block; }
  body { background: #fff; color: #000; }
  details.more { break-inside: avoid; }
  details.more:not([open]) > :not(summary) { display: block; }
}
</style>
