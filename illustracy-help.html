<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illustracy 도움말: 쓰는 법과 분리 원리</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --panel-2: #eef0f4; --line: #d9dce3; --line-2: #c4c8d2;
  --text: #1c1e24; --muted: #5f6470; --accent: #4b6ae0; --accent-2: #3a58cc; --accent-ink: #ffffff;
  --sel: #e1e7ff; --sel-ink: #1c1e24; --ok: #2f9e6a; --warn: #b7791f; --danger: #c94a4a;
  --hover: rgba(28, 30, 36, .05); --soft: rgba(28, 30, 36, .04); --mark: rgba(75, 106, 224, .16);
  --stage: #e9ebf0; --chk: #d9d9d9; --chk-bg: #ffffff;
  --ui-font: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --radius: 8px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171b; --panel: #1f2126; --panel-2: #272a31; --line: #34373f; --line-2: #4a4e59;
    --text: #e7e8ec; --muted: #9a9ea8; --accent: #6c8cff; --accent-2: #4b6ae0; --accent-ink: #ffffff;
    --sel: #2e3650; --sel-ink: #ffffff; --ok: #4cc38a; --warn: #e0a84b; --danger: #e06363;
    --hover: rgba(231, 232, 236, .06); --soft: rgba(231, 232, 236, .04); --mark: rgba(108, 140, 255, .22);
    --stage: #101114;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16171b; --panel: #1f2126; --panel-2: #272a31; --line: #34373f; --line-2: #4a4e59;
  --text: #e7e8ec; --muted: #9a9ea8; --accent: #6c8cff; --accent-2: #4b6ae0; --accent-ink: #ffffff;
  --sel: #2e3650; --sel-ink: #ffffff; --ok: #4cc38a; --warn: #e0a84b; --danger: #e06363;
  --hover: rgba(231, 232, 236, .06); --soft: rgba(231, 232, 236, .04); --mark: rgba(108, 140, 255, .22);
  --stage: #101114;
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
.tocbox *, .tocbox *::before, .tocbox *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.75 var(--ui-font); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 12px; z-index: 50; background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); }
.chk {
  background-color: var(--chk-bg);
  background-image: linear-gradient(45deg, var(--chk) 25%, transparent 25%), linear-gradient(-45deg, var(--chk) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--chk) 75%), linear-gradient(-45deg, transparent 75%, var(--chk) 75%);
  background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1180px; margin: 0 auto; padding: 9px 24px; display: flex; align-items: center; gap: 12px; }
.brand { min-width: 0; display: flex; align-items: center; gap: 9px; color: var(--text); font-weight: 700; font-size: 15px; letter-spacing: .2px; text-decoration: none; }
.brand svg { width: 24px; height: 24px; flex: none; }
.brand .sub { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: -2px; }
.brand .ver { padding: 0 7px; border: 1px solid var(--line); border-radius: 99px; font-size: 11.5px; font-weight: 700; line-height: 1.6; letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { white-space: nowrap; flex: none; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--sel); color: var(--sel-ink); border: 1px solid var(--accent); }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--accent-2); background: var(--accent-2); color: var(--accent-ink); font-weight: 600; font-size: 13px; text-decoration: none; }
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 520px) { header.top .brand .sub { display: none; } }
@media (max-width: 480px) { header.top .chip { display: none; } .top .in { gap: 8px; } }
@media (max-width: 350px) { header.top .brand .ver { display: none; } }
@media (max-width: 640px) { header.top .btn .lbl { display: none; } header.top .btn { padding: 0 8px; } }
.tseg { position: relative; display: inline-flex; flex: none; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.tseg .thumb { position: absolute; top: 0; left: 0; background: var(--sel); box-shadow: inset 0 -2px 0 var(--accent); pointer-events: none; will-change: transform; transition: background-color .2s ease; }
.tseg .opt { all: unset; box-sizing: border-box; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 30px; cursor: pointer; line-height: 0; color: var(--muted); transition: color .2s ease; }
.tseg .opt + .opt { width: 33px; border-left: 1px solid var(--line); }
.tseg .opt[aria-checked="true"] { color: var(--sel-ink); }
.tseg .opt[aria-checked="false"]:hover { background: var(--hover); color: var(--text); }
.tseg .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 5px; }
.tseg .opt svg { display: block; flex: none; width: 18px; height: 18px; }
.layout { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 40px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); align-self: start; max-height: calc(100vh - 82px); overflow: auto; margin-top: 18px; padding: 12px 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.tocbox > summary { display: none; cursor: pointer; font-weight: 700; list-style: none; }
.tocbox > summary::-webkit-details-marker { display: none; }
.side h2.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 2px 2px 8px; font-weight: 700; }
.search { position: relative; }
.search svg { position: absolute; left: 9px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { box-sizing: border-box; display: block; width: 100%; min-height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 0 10px 0 30px; font: inherit; font-size: 13.5px; }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.toc { margin-top: 12px; font-size: 13.5px; line-height: 1.45; }
.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: tc; }
.toc > ol > li { margin: 1px 0 6px; counter-increment: tc; }
.toc > ol > li > a { font-weight: 700; color: var(--text); }
.toc > ol > li > a::before { content: attr(data-n) ". "; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.toc ol ol { margin: 3px 0 0 12px; border-left: 1px solid var(--line); }
.toc ol ol a { color: var(--muted); }
.toc a { display: block; padding: 3px 10px; border-radius: 5px; text-decoration: none; }
.toc a:hover { background: var(--hover); color: var(--text); }
.toc a[aria-current="true"] { background: var(--sel); color: var(--sel-ink); box-shadow: inset 2px 0 0 var(--accent); }
.toc > ol > li > a[aria-current="true"]::before { color: inherit; }
.noresult { font-size: 13px; color: var(--muted); margin: 12px 4px 2px; }
.hits { font-size: 12px; color: var(--muted); margin: 6px 4px 0; }
.doc { min-width: 0; max-width: 820px; padding-top: 26px; word-break: keep-all; overflow-wrap: break-word; }
.crumb { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.doc h1 { font-size: clamp(27px, 4vw, 36px); line-height: 1.25; letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance; }
.lede { font-size: 16.5px; color: var(--muted); margin: 0 0 20px; text-wrap: pretty; }
.doc h2 { font-size: 25px; letter-spacing: -.015em; line-height: 1.3; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.doc h2 .no { font-size: 13px; font-weight: 700; color: var(--accent); background: var(--sel); border-radius: 6px; padding: 1px 8px; letter-spacing: 0; font-variant-numeric: tabular-nums; flex: none; transform: translateY(-3px); }
.doc h3 { font-size: 18.5px; letter-spacing: -.01em; line-height: 1.35; margin: 30px 0 8px; }
.doc h4 { font-size: 15px; margin: 20px 0 6px; }
.topic { margin-top: 52px; padding-top: 30px; border-top: 1px solid var(--line); }
.topic:first-of-type { margin-top: 24px; }
.doc p, .doc li { text-wrap: pretty; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li + li { margin-top: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.callout { margin: 18px 0; padding: 13px 16px 13px 15px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.callout p { margin: 0; }
.callout p + p { margin-top: 8px; }
.callout.big p:first-child { font-weight: 700; font-size: 16px; }
.callout.warn { border-left-color: var(--warn); }
.callout.danger { border-left-color: var(--danger); }
.note { font-size: 13.5px; color: var(--muted); }
.why { font-size: 13.5px; line-height: 1.7; color: var(--muted); margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line-2); background: var(--soft); border-radius: 0 var(--radius) var(--radius) 0; }
.why b { color: var(--text); font-weight: 600; }
.why math { font-size: 1em; }
.refs li:target { background: var(--mark); border-radius: 4px; }
kbd, .k { font: 700 12px/1 var(--ui-font); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 6px; background: var(--panel-2); color: var(--text); white-space: nowrap; }
.ui { font-weight: 600; white-space: nowrap; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); font-size: .92em; }
.ui.p { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
code { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
pre { font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.55; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: none; }
th { font-size: 11.5px; color: var(--muted); font-weight: 700; background: var(--panel-2); white-space: nowrap; letter-spacing: .3px; }
td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
tr.hl td { background: var(--sel); }
details.more { margin: 12px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
details.more > summary { cursor: pointer; padding: 9px 14px; font-weight: 700; font-size: 14px; }
details.more > summary:hover { background: var(--hover); }
details.more > .tbl { margin: 0; border: none; border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); }
details.more > .in { padding: 4px 16px 10px; border-top: 1px solid var(--line); }
dl.terms { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 12px 0; }
dl.terms dt { font-weight: 700; }
dl.terms dd { margin: 0; }
.refs li { font-size: 14px; }
math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Noto Sans Math", math; font-size: 1.07em; }
.eq { overflow-x: auto; overflow-y: hidden; margin: 12px 0; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.eq math { margin: 0; }
.eq + .eq { margin-top: -4px; }
.flow { display: grid; gap: 14px; margin: 16px 0; }
.stage { border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 4px; background: var(--panel); }
.stage .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 99px; background: var(--accent-2); color: var(--accent-ink); margin-bottom: 10px; }
.stage.light .tag { background: var(--sel); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--accent); }
.stage.mid .tag { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.stage ol { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.stage li { position: relative; padding: 8px 12px 8px 42px; margin: 0 0 8px; border-radius: 6px; background: var(--panel-2); }
.stage li + li { margin-top: 0; }
.stage li::before { counter-increment: st; content: counter(st); position: absolute; left: 11px; top: 10px; width: 21px; height: 21px; border-radius: 50%; background: var(--accent-2); color: var(--accent-ink); font-size: 11.5px; font-weight: 800; line-height: 21px; text-align: center; }
.stage li b { display: block; font-size: 14px; }
.stage li span { display: block; font-size: 13px; color: var(--muted); line-height: 1.5; }
.graph { overflow-x: auto; margin: 16px 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.graph .row { display: flex; align-items: center; gap: 10px; min-width: 560px; }
.graph .col { display: grid; gap: 8px; }
.graph .node { border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 700; background: var(--panel-2); white-space: nowrap; }
.graph .node small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.graph .node.key { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
.graph .node.key small { color: rgba(255, 255, 255, .8); }
.graph .arrow { color: var(--muted); font-size: 18px; }
.graph .cap { min-width: 560px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin: 18px 0 8px; }
.stack { position: relative; height: 210px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--stage); overflow: hidden; }
.stack .sheet { position: absolute; width: 118px; height: 132px; border: 1px solid rgba(0, 0, 0, .25); border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); background-size: 10px 10px; }
.stack .sheet.chk { background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0; }
.stack .sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stack .lab { position: absolute; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.stack .one { left: 16px; top: 38px; }
.stack .arr { position: absolute; left: 146px; top: 92px; color: var(--muted); font-size: 22px; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; font-size: 13px; line-height: 1.45; }
.panel .hd { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.panel .hd b { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.lrow { display: grid; grid-template-columns: 18px 30px 1fr; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: none; }
.lrow.grp { background: var(--panel-2); }
.lrow.sel { background: var(--sel); color: var(--sel-ink); }
.lrow .eye { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 9px; line-height: 1; }
.lrow .eye.on::after { content: "●"; }
.lrow .th { width: 30px; height: 30px; border-radius: 3px; border: 1px solid var(--line); overflow: hidden; background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0; }
.lrow .th.fold { background: var(--panel-2); display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.lrow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .sb { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
.lrow.sel .sb { color: inherit; opacity: .8; }
.lrow .sb .cl { color: var(--warn); }
.lrow.i1 { padding-left: 22px; } .lrow.i2 { padding-left: 34px; } .lrow.i3 { padding-left: 46px; }
.shot { display: grid; grid-template-columns: 0.9fr 1.6fr 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 14px 0; background: var(--panel); font-size: 12px; min-width: 0; }
.shot > div { padding: 10px; min-width: 0; }
.shot .l { border-right: 1px solid var(--line); }
.shot .r { border-left: 1px solid var(--line); }
.shot .c { background: var(--stage); display: grid; grid-template-rows: auto 1fr; gap: 8px; padding: 0; }
.shot .bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.shot .bar span { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; background: var(--panel-2); white-space: nowrap; }
.shot .bar span.on { background: var(--sel); color: var(--sel-ink); }
.shot .cv { margin: 6px 14px 14px; border-radius: 3px; min-height: 120px; box-shadow: 0 2px 14px rgba(0, 0, 0, .4); }
.shot .t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.shot .f { height: 7px; border-radius: 4px; background: var(--panel-2); margin: 7px 0; }
.shot .f.s { width: 60%; } .shot .f.a { background: var(--accent-2); width: 70%; }
.shot .n { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 6px 0 2px; }
.legend b { color: var(--accent); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; border: 1px solid var(--line-2); margin-right: 4px; }
.steps { counter-reset: sp; list-style: none; padding-left: 0 !important; }
.steps > li { position: relative; padding-left: 36px; margin: 10px 0; }
.steps > li::before { counter-increment: sp; content: counter(sp); position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 6px; background: var(--sel); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--accent); font-size: 12.5px; font-weight: 800; line-height: 24px; text-align: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
.kpi { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 10px 12px; }
.kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--accent); }
.kpi .d { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.bars { display: grid; gap: 6px; margin: 12px 0; }
.bars .b { display: grid; grid-template-columns: 54px 1fr 64px; gap: 10px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bars .b .tr { height: 12px; background: var(--panel-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bars .b .tr i { display: block; height: 100%; background: var(--accent-2); }
.bars .b.hl .tr i { background: var(--accent); }
.bars .b span:last-child { text-align: right; color: var(--muted); }
.foot { max-width: 1180px; margin: 0 auto; padding: 18px 24px 30px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 16px 56px; }
  .side { position: static; max-height: none; overflow: visible; margin-top: 14px; padding: 10px 12px; }
  .tocbox > summary { display: flex; align-items: center; justify-content: space-between; }
  .tocbox > summary::after { content: "▾"; color: var(--muted); }
  .tocbox[open] > summary::after { content: "▴"; }
  .tocbox[open] > summary { margin-bottom: 10px; }
  .side h2.lbl { display: none; }
  .top .in { padding: 8px 16px; }
  dl.terms { grid-template-columns: 1fr; gap: 2px; }
  dl.terms dd { margin-bottom: 10px; }
  .hero { grid-template-columns: 1fr; }
  .shot { grid-template-columns: 1fr; }
